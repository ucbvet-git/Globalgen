<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GLOBALGEN — Gestão de Orçamentos</title>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--pr:#199198;--deep:#004446;--lt:#E4F5F6;--sf:#F2F8F8;--bd:#B8D4D6;--tx:#1A2C2E;--mt:#4A7275;--wh:#fff;--green:#2B9960;--glt:#E6F5EE;--rd:#C83232}
body{font-family:'Inter',sans-serif;background:var(--sf);color:var(--tx);min-height:100vh}
/* ── Login ── */
#login-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:32px 20px}
.login-box{background:#fff;border-radius:16px;border:1.5px solid var(--bd);padding:40px 32px;width:100%;max-width:380px;text-align:center}
.login-logo{max-height:52px;margin-bottom:24px}
.login-title{font-size:18px;font-weight:800;color:var(--deep);margin-bottom:6px}
.login-sub{font-size:13px;color:var(--mt);margin-bottom:24px}
.login-inp{width:100%;border:1.5px solid var(--bd);border-radius:10px;padding:12px 14px;font-size:15px;font-family:inherit;outline:none;margin-bottom:12px;text-align:center;letter-spacing:3px}
.login-inp:focus{border-color:var(--pr)}
.login-btn{width:100%;padding:13px;background:var(--deep);color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.login-btn:active{background:var(--pr)}
.login-err{color:var(--rd);font-size:12px;margin-top:8px;min-height:16px}
/* ── App ── */
#app{display:none}
.hdr{background:var(--deep);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.hdr-logo{height:28px}
.hdr-title{color:rgba(255,255,255,.7);font-size:13px;font-weight:500}
.hdr-logout{color:rgba(255,255,255,.5);font-size:12px;cursor:pointer;text-decoration:underline;background:none;border:none;font-family:inherit}
/* ── Filtros ── */
.filters{background:#fff;border-bottom:1px solid var(--bd);padding:14px 24px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.f-label{font-size:11px;font-weight:700;color:var(--mt);margin-right:-4px}
.f-inp{border:1.5px solid var(--bd);border-radius:8px;padding:7px 10px;font-size:13px;font-family:inherit;color:var(--tx);outline:none;background:#fff}
.f-inp:focus{border-color:var(--pr)}
.f-btn{padding:7px 14px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;border:none}
.f-btn-clear{background:var(--sf);color:var(--mt);border:1.5px solid var(--bd)}
.f-btn-export{background:var(--green);color:#fff}
.f-spacer{flex:1}
/* ── Stats ── */
.stats{display:flex;gap:12px;padding:16px 24px;background:var(--sf);flex-wrap:wrap}
.stat{background:#fff;border:1.5px solid var(--bd);border-radius:10px;padding:12px 16px;flex:1;min-width:140px}
.stat-val{font-size:22px;font-weight:800;color:var(--deep)}
.stat-lbl{font-size:11px;color:var(--mt);margin-top:2px}
/* ── Lista ── */
.lista{padding:16px 24px;display:flex;flex-direction:column;gap:10px}
.card{background:#fff;border:1.5px solid var(--bd);border-radius:12px;padding:16px;cursor:pointer;transition:border-color .12s,box-shadow .12s}
.card:hover{border-color:var(--pr);box-shadow:0 2px 12px rgba(25,145,152,.1)}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:8px}
.card-cliente{font-size:14px;font-weight:700;color:var(--tx)}
.card-doc{font-size:11px;color:var(--mt);margin-top:2px}
.card-valor{font-size:16px;font-weight:800;color:var(--pr);text-align:right;white-space:nowrap}
.card-valor-sub{font-size:10.5px;color:var(--mt);text-align:right}
.card-mid{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.badge{background:var(--lt);color:var(--deep);font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:20px}
.badge.mod{background:#FFF3E0;color:#B26000}
.card-bot{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;color:var(--mt)}
.card-rep{font-weight:500}
.card-data{text-align:right}
.empty{text-align:center;padding:60px 20px;color:var(--mt)}
/* ── Modal ── */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;align-items:center;justify-content:center;padding:16px}
.overlay.on{display:flex}
.modal{background:#fff;border-radius:16px;width:100%;max-width:680px;max-height:90vh;overflow-y:auto;padding:24px}
.modal-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.modal-title{font-size:17px;font-weight:800;color:var(--deep)}
.modal-close{background:var(--sf);border:1.5px solid var(--bd);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:13px;font-family:inherit}
.m-sec{background:var(--sf);border-radius:10px;padding:14px;margin-bottom:12px}
.m-sec-title{font-size:10px;font-weight:800;color:var(--mt);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px}
.m-row{display:flex;justify-content:space-between;font-size:12.5px;padding:4px 0;border-bottom:1px solid var(--bd)}
.m-row:last-child{border-bottom:none}
.m-rl{color:var(--mt)}
.m-rv{font-weight:600;text-align:right}
.m-rv.pos{color:var(--green)}
.m-rv.neg{color:var(--rd)}
.m-table{width:100%;border-collapse:collapse;font-size:11.5px}
.m-table th{background:var(--deep);color:#fff;padding:6px 8px;text-align:left;font-size:10px}
.m-table th.r,.m-table td.r{text-align:right}
.m-table td{padding:5px 8px;border-bottom:1px solid #E4EEEF}
.m-table tr:last-child td{border-bottom:none}
.m-table tr.alt td{background:var(--sf)}
.m-actions{display:flex;gap:8px;margin-top:16px}
.m-btn-pdf{flex:1;padding:12px;background:var(--green);color:#fff;border:none;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
.loading{text-align:center;padding:60px;color:var(--mt);font-size:14px}
/* ── Print ── */
@media screen{.print-only{display:none!important}}
@media print{
  #app>*:not(#print-area){display:none!important}
  #print-area{display:block!important}
  body{background:#fff}
  .pp{padding:22px 28px;font-family:'Inter',sans-serif}
  .p-hdr{display:flex;justify-content:space-between;border-bottom:4px solid #199198;padding-bottom:14px;margin-bottom:16px}
  .p-logo{max-height:44px}
  .p-orc-lbl{font-size:9px;font-weight:800;color:#999;text-transform:uppercase}
  .p-orc-num{font-size:16px;font-weight:800;color:#004446}
  .p-orc-meta{font-size:10px;color:#666;line-height:1.6}
  .p-kit{background:#004446;padding:8px 12px;border-radius:5px;margin-bottom:12px}
  .p-kit-nm{font-size:12px;font-weight:700;color:#fff}
  table{width:100%;border-collapse:collapse;font-size:11px;margin:8px 0}
  th{background:#199198;color:#fff;padding:5px 8px;text-align:left;font-size:9.5px;font-weight:700}
  th.r,td.r{text-align:right}
  td{padding:4px 8px;border-bottom:1px solid #E4EEEF}
  .ptr{display:flex;justify-content:space-between;padding:3px 0;font-size:11px;border-bottom:1px solid #E4EEEF}
  .ptr.big{font-size:15px;font-weight:800;color:#199198;border-top:2px solid #199198;border-bottom:none;padding-top:6px;margin-top:4px}
  .ptr.neg{color:#C83232;font-weight:600}
  .ptr.pos{color:#2B9960;font-weight:600}
  .p-ti{float:right;width:260px}
  .p-clr{clear:both}
  .p-sec{font-size:8px;font-weight:800;color:#5F7A8E;text-transform:uppercase;letter-spacing:.5px;margin:10px 0 4px}
  .p-acc{margin-top:14px;font-size:9px;color:#777;text-align:center;font-style:italic;border-top:1px dashed #ccc;padding-top:8px}
}
</style>
</head>
<body>
<!-- Login -->
<div id="login-screen">
  <div class="login-box">
    <svg class="login-logo" viewBox="0 0 360 104" xmlns="http://www.w3.org/2000/svg"><defs><style>.c1{fill:#199198}.c2{fill:#004446}.c3{fill:#878787}.c4{fill:#070508}</style></defs><path class="c2" d="M0,28.6v47h10.3V58.1h7.4c5.9,0,10.5-1.5,13.8-4.6,3.4-3.1,5.1-7.3,5.1-12.5,0-5-1.6-9-4.8-12-3.2-2.9-7.7-4.4-13.4-4.4H0zm10.3,8.6h5.8c2.7,0,4.8.6,6.1,1.9,1.4,1.2,2.1,3.1,2.1,5.5,0,2.6-.7,4.6-2.2,5.9-1.5,1.4-3.7,2.1-6.5,2.1h-5.3V37.1z"/><path class="c1" d="M54.7,28.6H44.4v47h10.3V28.6z"/><path class="c2" d="M96.2,28.6H86L63.5,75.5h10.7l4.1-9.3h25l4.1,9.3h11.4L96.2,28.6zm-14.4,29.8l8.3-19,8.3,19H81.8z"/><path class="c4" d="M156.2,74.2V32.3h15.5c2.1,0,4,.3,5.7.9,1.7.6,3.1,1.5,4.2,2.7,1.2,1.1,2,2.5,2.7,4.1.6,1.6.9,3.4.9,5.4s-.3,3.8-1,5.5-1.6,3-2.8,4.2c-1.2,1.2-2.7,2.1-4.4,2.7-1.7.6-3.6,1-5.7,1h-11.1v15.5h-4Zm4-19.1h11c1.4,0,2.7-.2,3.9-.6,1.2-.4,2.2-1,3.1-1.8.9-.8,1.5-1.8,2-3,.5-1.2.7-2.5.7-4s-.2-2.8-.7-4c-.5-1.1-1.1-2.1-2-2.9-.8-.8-1.9-1.4-3.1-1.7-1.2-.4-2.5-.6-3.9-.6h-11v18.5z"/><path class="c4" d="M243.4,32.3h3.8l14.6,33.3.8,2.2.7,2.3.6-2.3.7-2.2L280.9,32.3h4L267.7,74.2h-4.1L243.4,32.3z"/><path class="c4" d="M293.1,74.2V32.3h26.3v3.6h-22.3v15.1h18.1v3.5h-18.1v16.2h22.3v3.6h-26.3z"/><path class="c3" d="M0,85.4v18.5h2.3v-7.4h9.6v-1.8H2.3v-7.5H13.3v-1.8H0z"/><path class="c3" d="M16.8,103.9V85.4h2.3v18.5h-2.3z"/><path class="c3" d="M84.1,103.9h-2.3V87.2h-6V85.4h14.2v1.8h-6v16.7z"/></svg>
    <div class="login-title">Gestão de Orçamentos</div>
    <div class="login-sub">Acesso restrito à gerência</div>
    <input class="login-inp" type="password" id="senha-inp" placeholder="Senha" autocomplete="off"
      onkeydown="if(event.key==='Enter')entrar()">
    <button class="login-btn" onclick="entrar()">Entrar</button>
    <div class="login-err" id="login-err"></div>
  </div>
</div>

<!-- App -->
<div id="app">
  <div class="hdr">
    <svg class="hdr-logo" viewBox="0 0 360 104" xmlns="http://www.w3.org/2000/svg"><defs><style>.c1{fill:#199198}.c2{fill:#004446}.c3{fill:#878787}.c4{fill:#fff}</style></defs><path class="c4" d="M0,28.6v47h10.3V58.1h7.4c5.9,0,10.5-1.5,13.8-4.6,3.4-3.1,5.1-7.3,5.1-12.5,0-5-1.6-9-4.8-12-3.2-2.9-7.7-4.4-13.4-4.4H0zm10.3,8.6h5.8c2.7,0,4.8.6,6.1,1.9,1.4,1.2,2.1,3.1,2.1,5.5,0,2.6-.7,4.6-2.2,5.9-1.5,1.4-3.7,2.1-6.5,2.1h-5.3V37.1z"/><path class="c1" d="M54.7,28.6H44.4v47h10.3V28.6z"/><path class="c4" d="M96.2,28.6H86L63.5,75.5h10.7l4.1-9.3h25l4.1,9.3h11.4L96.2,28.6zm-14.4,29.8l8.3-19,8.3,19H81.8z"/></svg>
    <span class="hdr-title">Gestão de Orçamentos</span>
    <button class="hdr-logout" onclick="sair()">Sair</button>
  </div>

  <div class="filters">
    <span class="f-label">Período:</span>
    <input class="f-inp" type="date" id="f-de" onchange="aplicarFiltros()">
    <span class="f-label">até</span>
    <input class="f-inp" type="date" id="f-ate" onchange="aplicarFiltros()">
    <span class="f-label">Representante:</span>
    <input class="f-inp" type="text" id="f-rep" placeholder="nome ou código" oninput="aplicarFiltros()" style="width:160px">
    <span class="f-label">Cliente:</span>
    <input class="f-inp" type="text" id="f-cli" placeholder="nome ou CNPJ/CPF" oninput="aplicarFiltros()" style="width:180px">
    <div class="f-spacer"></div>
    <button class="f-btn f-btn-clear" onclick="limparFiltros()">Limpar filtros</button>
    <button class="f-btn f-btn-export" onclick="exportarCSV()">⬇ Exportar CSV</button>
  </div>

  <div class="stats" id="stats"></div>
  <div class="lista" id="lista"><div class="loading">⏳ Carregando orçamentos...</div></div>
</div>

<!-- Modal detalhes -->
<div class="overlay" id="overlay" onclick="if(event.target===this)fecharModal()">
  <div class="modal" id="modal-content"></div>
</div>

<!-- Área de impressão (PDF) -->
<div id="print-area" class="print-only"></div>

<script>
const FB_CONFIG={
  apiKey:'AIzaSyBohpz0jxsA9TCowjx8COBhQGeRZYBv-yo',
  authDomain:'globalgen-orcamentos.firebaseapp.com',
  projectId:'globalgen-orcamentos',
  storageBucket:'globalgen-orcamentos.firebasestorage.app',
  messagingSenderId:'643022729799',
  appId:'1:643022729799:web:d0aa2a959a73f6f4c4f762'
};
const SENHA='supersenha';
let db=null, todosOrc=[], filtrados=[];

function fmt(v){return new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(v||0)}
function fmtPct(v){return(v*100).toFixed(1)+'%'}

// ── AUTH ──
function entrar(){
  const s=document.getElementById('senha-inp').value;
  const err=document.getElementById('login-err');
  if(s!==SENHA){err.textContent='Senha incorreta.';return;}
  err.textContent='';
  document.getElementById('login-screen').style.display='none';
  document.getElementById('app').style.display='block';
  iniciarApp();
}
function sair(){
  document.getElementById('login-screen').style.display='flex';
  document.getElementById('app').style.display='none';
  document.getElementById('senha-inp').value='';
}
document.getElementById('senha-inp').addEventListener('keydown',e=>{if(e.key==='Enter')entrar();});

// ── FIREBASE ──
async function iniciarApp(){
  try{
    const app=firebase.apps.find(a=>a.name==='gestao')||firebase.initializeApp(FB_CONFIG,'gestao');
    db=firebase.firestore(app);
    await carregarOrcamentos();
  }catch(e){document.getElementById('lista').innerHTML=`<div class="empty">❌ Erro ao conectar: ${e.message}</div>`;}
}
async function carregarOrcamentos(){
  document.getElementById('lista').innerHTML='<div class="loading">⏳ Carregando orçamentos...</div>';
  try{
    const snap=await db.collection('orcamentos').orderBy('ts','desc').get();
    todosOrc=snap.docs.map(d=>({id:d.id,...d.data(),
      _tsMs:d.data().ts?.toMillis()||0,
      _data:d.data().ts?.toDate()||new Date(0)
    }));
    aplicarFiltros();
  }catch(e){document.getElementById('lista').innerHTML=`<div class="empty">❌ ${e.message}<br><small>Verifique as regras do Firestore.</small></div>`;}
}

// ── FILTROS ──
function aplicarFiltros(){
  const de=document.getElementById('f-de').value;
  const ate=document.getElementById('f-ate').value;
  const rep=document.getElementById('f-rep').value.toLowerCase();
  const cli=document.getElementById('f-cli').value.toLowerCase();
  filtrados=todosOrc.filter(o=>{
    if(de&&o._data<new Date(de))return false;
    if(ate&&o._data>new Date(ate+'T23:59:59'))return false;
    if(rep&&!(o.nomeRep||'').toLowerCase().includes(rep)&&!String(o.codRep).includes(rep))return false;
    if(cli&&!(o.clienteNome||'').toLowerCase().includes(cli)&&!(o.clienteDoc||'').includes(cli))return false;
    return true;
  });
  renderStats();
  renderLista();
}
function limparFiltros(){
  ['f-de','f-ate','f-rep','f-cli'].forEach(id=>document.getElementById(id).value='');
  aplicarFiltros();
}

// ── STATS ──
function renderStats(){
  const total=filtrados.reduce((s,o)=>s+(o.totalFinal||0),0);
  const bonif=filtrados.reduce((s,o)=>s+(o.totalBonif||0),0);
  const kits={};filtrados.forEach(o=>{kits[o.kitNome||'?']=(kits[o.kitNome||'?']||0)+1;});
  const topKit=Object.entries(kits).sort((a,b)=>b[1]-a[1])[0];
  document.getElementById('stats').innerHTML=`
    <div class="stat"><div class="stat-val">${filtrados.length}</div><div class="stat-lbl">Orçamentos</div></div>
    <div class="stat"><div class="stat-val">${fmt(total)}</div><div class="stat-lbl">Valor Total Final</div></div>
    <div class="stat"><div class="stat-val">${fmt(bonif)}</div><div class="stat-lbl">Total Bonificado</div></div>
    <div class="stat"><div class="stat-val">${topKit?topKit[0].split('·')[1]?.trim()||topKit[0]:'—'}</div><div class="stat-lbl">Kit mais orçado</div></div>`;
}

// ── LISTA ──
function renderLista(){
  const el=document.getElementById('lista');
  if(!filtrados.length){el.innerHTML='<div class="empty">Nenhum orçamento encontrado.</div>';return;}
  el.innerHTML=filtrados.map((o,i)=>`
    <div class="card" onclick="abrirModal(${i})">
      <div class="card-top">
        <div>
          <div class="card-cliente">${o.clienteNome||'Cliente não identificado'}</div>
          <div class="card-doc">${o.clienteDoc||''} · ${o.dataHora||''}</div>
        </div>
        <div>
          <div class="card-valor">${fmt(o.totalFinal)}</div>
          <div class="card-valor-sub">Bonif: ${fmt(o.totalBonif)}</div>
        </div>
      </div>
      <div class="card-mid">
        <span class="badge">${o.kitNome||''}</span>
        ${o.tags?`<span class="badge mod">${o.tags}</span>`:''}
        <span class="badge">${o.nProt||0} protocolos</span>
        <span class="badge">${o.preco==='campanha'?'Campanha':'Normal'}</span>
      </div>
      <div class="card-bot">
        <span class="card-rep">👤 ${o.nomeRep||'—'} (Cód: ${o.codRep||'—'})</span>
        <span class="card-data">${o.pagamento||''}</span>
      </div>
    </div>`).join('');
}

// ── MODAL ──
function abrirModal(idx){
  const o=filtrados[idx];
  const prods=(o.prods||[]);
  const avulsos=(o.prodsAvulso||[]);
  const bonifAplic=(o.bonifAplic||[]);
  const modal=document.getElementById('modal-content');
  modal.innerHTML=`
    <div class="modal-hdr">
      <div class="modal-title">${o.clienteNome||'Orçamento'}</div>
      <button class="modal-close" onclick="fecharModal()">✕ Fechar</button>
    </div>
    <div class="m-sec">
      <div class="m-sec-title">Cliente</div>
      <div class="m-row"><span class="m-rl">CNPJ/CPF</span><span class="m-rv">${o.clienteDoc||'—'}</span></div>
      <div class="m-row"><span class="m-rl">Razão Social</span><span class="m-rv">${o.clienteNome||'—'}</span></div>
      <div class="m-row"><span class="m-rl">Representante</span><span class="m-rv">${o.nomeRep||'—'} (Cód: ${o.codRep||'—'})</span></div>
      <div class="m-row"><span class="m-rl">Data/Hora</span><span class="m-rv">${o.dataHora||'—'}</span></div>
    </div>
    <div class="m-sec">
      <div class="m-sec-title">Protocolo</div>
      <div class="m-row"><span class="m-rl">Kit</span><span class="m-rv">${o.kitNome||'—'}</span></div>
      ${o.tags?`<div class="m-row"><span class="m-rl">Variação</span><span class="m-rv">${o.tags}</span></div>`:''}
      <div class="m-row"><span class="m-rl">Nº Protocolos</span><span class="m-rv">${o.nProt||0} animais</span></div>
      ${o.vacinas?`<div class="m-row"><span class="m-rl">Vacinas</span><span class="m-rv">Vac-Cherry ${o.vacinas.frasco} · ${o.vacinas.qtdFrascos}</span></div>`:''}
    </div>
    ${prods.length?`<div class="m-sec"><div class="m-sec-title">Produtos do Kit</div>

    ${avulsos.length?`<div class="m-sec"><div class="m-sec-title">Itens Avulsos</div>
    <table class="m-table"><thead><tr><th>Produto</th><th class="r">Qtde</th><th class="r">R$ Unit.</th><th class="r">Valor</th></tr></thead>

    <table class="m-table"><thead style="background:var(--green)"><tr><th>Produto</th><th class="r">Qtde Bonif.</th><th class="r">Valor Bonif.</th></tr></thead>
    <tbody>${bonifAplic.map((p,i)=>`<tr${i%2?' class="alt"':''}>

    </tr>`).join('')}</tbody></table></div>`:''}
    <div class="m-sec">
      <div class="m-sec-title">Totais</div>
      <div class="m-row"><span class="m-rl">Total Pedido</span><span class="m-rv">${fmt(o.totalPedido)}</span></div>
      <div class="m-row"><span class="m-rl">Valor Total Protocolos</span><span class="m-rv">${fmt(o.valorProtocolo)}</span></div>
      <div class="m-row"><span class="m-rl">🎁 Bonificação</span><span class="m-rv neg">− ${fmt(o.totalBonif)}</span></div>

      <div class="m-row"><span class="m-rl">À Vista (−3%)</span><span class="m-rv pos">${fmt(o.aVista)}</span></div>
      <div class="m-row"><span class="m-rl">Prazo de Pagamento</span><span class="m-rv">${o.pagamento||'—'}</span></div>
      <div class="m-row"><span class="m-rl">Valor da Parcela</span><span class="m-rv">${fmt(o.valorParcela)}</span></div>
      <div class="m-row"><span class="m-rl">Valor por Protocolo</span><span class="m-rv">${fmt(o.valorPorProt)}</span></div>
    </div>
    ${o.obs?`<div class="m-sec"><div class="m-sec-title">Observações</div><div style="font-size:13px;line-height:1.6">${o.obs}</div></div>`:''}
    <div class="m-actions">
      <button class="m-btn-pdf" onclick="gerarPDFModal(${idx})">📄 Gerar PDF</button>

  document.getElementById('overlay').classList.add('on');
}
function fecharModal(){document.getElementById('overlay').classList.remove('on');}

// ── PDF DO MODAL ──

  const bonifAplic=o.bonifAplic||[];

  const avRows=avulsos.map((p,i)=>`<tr${i%2?' class="alt"':''}><td>${p.nome}</td><td class="r">${p.qty}</td><td class="r">${fmt(p.preco)}</td><td class="r">${fmt(p.valor)}</td></tr>`).join('');
  const bonifRows=bonifAplic.map((p,i)=>`<tr${i%2?' class="alt"':''}><td>${p.nome}</td><td class="r">${p.qty}</td><td class="r">${fmt(p.valor)}</td></tr>`).join('');
  document.getElementById('print-area').innerHTML=`
  <div class="pp">
    <div class="p-hdr">
      <svg class="p-logo" viewBox="0 0 360 104" xmlns="http://www.w3.org/2000/svg"><defs><style>.c1{fill:#199198}.c2{fill:#004446}.c3{fill:#878787}.c4{fill:#070508}</style></defs><path class="c2" d="M0,28.6v47h10.3V58.1h7.4c5.9,0,10.5-1.5,13.8-4.6,3.4-3.1,5.1-7.3,5.1-12.5,0-5-1.6-9-4.8-12-3.2-2.9-7.7-4.4-13.4-4.4H0zm10.3,8.6h5.8c2.7,0,4.8.6,6.1,1.9,1.4,1.2,2.1,3.1,2.1,5.5,0,2.6-.7,4.6-2.2,5.9-1.5,1.4-3.7,2.1-6.5,2.1h-5.3V37.1z"/><path class="c1" d="M54.7,28.6H44.4v47h10.3V28.6z"/><path class="c2" d="M96.2,28.6H86L63.5,75.5h10.7l4.1-9.3h25l4.1,9.3h11.4L96.2,28.6zm-14.4,29.8l8.3-19,8.3,19H81.8z"/></svg>
      <div class="p-orc">
        <div class="p-orc-lbl">Orçamento</div>
        <div class="p-orc-num">${o.dataHora||''}</div>
        <div class="p-orc-meta">Cliente: ${o.clienteNome||'—'}<br>CNPJ/CPF: ${o.clienteDoc||'—'}<br>Representante: ${o.nomeRep||'—'} (Cód: ${o.codRep||'—'})</div>
      </div>
    </div>
    <div class="p-kit"><div class="p-kit-nm">${o.kitNome||'—'}${o.tags?' · '+o.tags:''}</div></div>
    <div class="p-sec">Produtos do Kit (${o.nProt||0} protocolos)</div>
    <table><thead><tr><th>Produto</th><th class="r">Qtde</th><th class="r">Bonif.</th><th class="r">R$ Unit.</th><th class="r">Valor</th></tr></thead><tbody>${prodRows}</tbody></table>
    ${avulsos.length?`<div class="p-sec">Itens Avulsos</div><table><thead><tr><th>Produto</th><th class="r">Qtde</th><th class="r">R$ Unit.</th><th class="r">Valor</th></tr></thead><tbody>${avRows}</tbody></table>`:''}
    ${bonifAplic.length?`<div class="p-sec" style="color:#2B9960">Aplicadores Bonificados</div><table><thead style="background:#2B9960"><tr><th>Produto</th><th class="r">Qtde Bonif.</th><th class="r">Valor Bonif.</th></tr></thead><tbody>${bonifRows}</tbody></table>`:''}
    <div class="p-ti">
      <div class="ptr"><span>Total Pedido</span><span>${fmt(o.totalPedido)}</span></div>
      <div class="ptr"><span>Valor Total Protocolos</span><span>${fmt(o.valorProtocolo)}</span></div>
      <div class="ptr neg"><span>🎁 Bonificação</span><span>− ${fmt(o.totalBonif)}</span></div>
      <div class="ptr big"><span>Total Final</span><span>${fmt(o.totalFinal)}</span></div>
      <div class="ptr pos"><span>À Vista (−3%)</span><span>${fmt(o.aVista)}</span></div>
      <div class="ptr"><span>Prazo de Pagamento</span><span>${o.pagamento||'—'}</span></div>
      <div class="ptr"><span>Valor da Parcela</span><span>${fmt(o.valorParcela)}</span></div>
      <div class="ptr"><span>Valor por Protocolo</span><span>${fmt(o.valorPorProt)}</span></div>
    </div>
    <div class="p-clr"></div>
    ${o.obs?`<div class="p-sec">Observações</div><p style="font-size:10px;color:#444">${o.obs}</p>`:''}
    <div class="p-acc">Orçamento gerado pelo sistema GLOBALGEN. Sujeito a confirmação e aprovação da matriz.</div>
  </div>`;
  setTimeout(()=>window.print(),100);
}

// ── CSV EXPORT ──
function exportarCSV(){
  if(!filtrados.length){alert('Nenhum orçamento para exportar.');return;}
  const cols=['Data/Hora','Cliente Nome','Cliente Doc','Tipo','Cód Representante','Nome Representante','Cód Cliente Senior','Kit','Variação','Nº Protocolos','Tabela Preço','Condição Pagamento','Total Pedido','Bonificação','Total Final','À Vista','Valor por Protocolo','Valor Parcela','Vacinas','Observações'];
  const rows=filtrados.map(o=>[
    o.dataHora||'',o.clienteNome||'',o.clienteDoc||'',o.clienteTipo||'',
    o.codRep||'',o.nomeRep||'',o.codCli||'',
    o.kitNome||'',o.tags||'',o.nProt||0,
    o.preco||'',o.pagamento||'',
    (o.totalPedido||0).toFixed(2),(o.totalBonif||0).toFixed(2),
    (o.totalFinal||0).toFixed(2),(o.aVista||0).toFixed(2),
    (o.valorPorProt||0).toFixed(2),(o.valorParcela||0).toFixed(2),
    o.vacinas?`Vac-Cherry ${o.vacinas.frasco} ${o.vacinas.qtdFrascos}`:'',
    o.obs||''
  ].map(v=>`"${String(v).replace(/"/g,'""')}"`).join(';'));
  const csv='\uFEFF'+[cols.join(';'),...rows].join('\n');
  const a=document.createElement('a');
  a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv);
  a.download=`orcamentos_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
}
