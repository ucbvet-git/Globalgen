<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>GLOBALGEN — Orçamento</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--pr:#199198;--deep:#004446;--lt:#E4F5F6;--sf:#F2F8F8;--bd:#B8D4D6;--tx:#1A2C2E;--mt:#4A7275;--wh:#fff;--green:#2B9960;--glt:#E6F5EE;--rd:#C83232}
body{font-family:'Inter',system-ui,sans-serif;background:var(--sf);color:var(--tx);max-width:480px;margin:0 auto;min-height:100vh}
.hdr{background:#fff;padding:9px 16px;position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--bd)}
.logo{display:none}
.brand-logo{height:38px;width:auto;max-width:245px;object-fit:contain}
.hdr-frac{color:var(--mt);font-size:12px;font-weight:600}
.prog-wrap{background:#fff;padding:0 16px 8px}
.prog-bar{height:3px;background:var(--bd);border-radius:2px;overflow:hidden}
.prog-fill{height:100%;background:var(--pr);border-radius:2px;transition:width .3s ease}
.step-hdr{padding:18px 16px 6px}
.step-title{font-size:21px;font-weight:800;color:var(--tx);line-height:1.2}
.step-sub{font-size:13px;color:var(--mt);margin-top:5px;line-height:1.5}
.content{padding:12px 16px 88px}
.bbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--wh);border-top:1px solid var(--bd);padding:10px 14px;display:flex;gap:8px;z-index:100}
.btn-nxt{flex:2;padding:12px;background:var(--pr);color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;-webkit-tap-highlight-color:transparent}
.btn-nxt.off{background:var(--bd);cursor:default}
.btn-nxt:not(.off):active{background:var(--deep)}
.btn-bk{flex:1;padding:12px;background:#fff;border:1.5px solid var(--pr);border-radius:10px;color:var(--pr);font-weight:700;font-size:13px;cursor:pointer;font-family:inherit}
.btn-pdf{flex:2;padding:12px;background:var(--green);color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.btn-skip{flex:1;padding:12px;background:none;border:none;color:var(--mt);text-decoration:underline;font-size:13px;cursor:pointer;font-family:inherit}
.card-list{display:flex;flex-direction:column;gap:8px}
.scard{background:#fff;border:1.5px solid var(--bd);border-radius:12px;padding:13px 14px;cursor:pointer;display:flex;align-items:center;gap:11px;transition:border-color .12s,background .12s;-webkit-tap-highlight-color:transparent}
.scard.on{border-color:var(--pr);background:var(--lt)}
.scard:active{transform:scale(.99)}
.sc-icon{width:38px;height:38px;border-radius:9px;background:var(--sf);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:18px}
.scard.on .sc-icon{background:rgba(25,145,152,.12)}
.sc-body{flex:1;min-width:0}
.sc-name{font-size:13.5px;font-weight:700;color:var(--tx);line-height:1.25}
.sc-desc{font-size:11.5px;color:var(--mt);margin-top:2px}
.sc-radio{width:19px;height:19px;border-radius:50%;border:1.5px solid var(--bd);flex-shrink:0;display:flex;align-items:center;justify-content:center;background:#fff;transition:all .12s}
.scard.on .sc-radio{border-color:var(--pr);background:var(--pr)}
.sc-chk{font-size:10px;color:#fff;display:none}
.scard.on .sc-chk{display:block}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pcard{background:#fff;border:1.5px solid var(--bd);border-radius:11px;padding:10px 8px;cursor:pointer;text-align:center;transition:all .12s;-webkit-tap-highlight-color:transparent}
.pcard.on{border-color:var(--pr);background:var(--lt)}
.pcard:active{transform:scale(.97)}
.pcard-icon{font-size:22px;margin-bottom:5px}
.pcard-name{font-size:12.5px;font-weight:700;color:var(--tx)}
.pcard-sub{font-size:10.5px;color:var(--mt);margin-top:2px}
.vsec{margin-bottom:16px}
.vsec-lbl{font-size:11.5px;font-weight:700;color:var(--mt);margin-bottom:7px;display:flex;align-items:center;gap:5px}
.vsec-dot{width:5px;height:5px;border-radius:50%;background:var(--pr)}
.num-box{background:#fff;border:1.5px solid var(--bd);border-radius:12px;padding:24px 18px;display:flex;flex-direction:column;align-items:center;gap:14px}
.num-row{display:flex;align-items:center;gap:14px}
.nbtn{width:48px;height:48px;border-radius:50%;border:1.5px solid var(--bd);background:#fff;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--pr);font-family:inherit;-webkit-tap-highlight-color:transparent}
.nbtn:active{background:var(--lt)}
.ninput{font-size:36px;font-weight:800;color:var(--tx);width:150px;text-align:center;background:none;border:none;outline:none;font-family:inherit}
.nlabel{font-size:13px;color:var(--mt)}
.qadd-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.qadd{padding:10px 4px;border-radius:8px;border:1.5px solid var(--bd);background:#fff;font-size:12.5px;font-weight:700;color:var(--pr);cursor:pointer;font-family:inherit;text-align:center;-webkit-tap-highlight-color:transparent}
.qadd:active{background:var(--lt)}
.tip{background:var(--lt);border:1.5px solid rgba(25,145,152,.3);border-radius:8px;padding:9px 13px;font-size:12px;color:var(--deep);margin-top:10px;line-height:1.5}
.tip-ok{background:var(--glt);border:1.5px solid rgba(43,153,96,.3);border-radius:8px;padding:9px 13px;font-size:12px;color:var(--green);margin-top:10px;line-height:1.5}
.vac-det{margin-top:10px;background:#fff;border:1.5px solid var(--pr);border-radius:11px;padding:13px;display:flex;flex-direction:column;gap:9px}
.vac-det-lbl{font-size:11px;font-weight:700;color:var(--mt);margin-bottom:4px}
.doses-inp{width:100%;border:1.5px solid var(--bd);border-radius:8px;padding:10px;font-size:20px;font-weight:700;font-family:inherit;color:var(--tx);text-align:center;outline:none}
.doses-inp:focus{border-color:var(--pr)}
.doses-res{background:var(--sf);border-radius:7px;padding:8px 11px;display:flex;justify-content:space-between;font-size:12.5px}
.dr-lbl{color:var(--mt)}
.dr-val{font-weight:700;color:var(--pr)}
.pgrp{margin-bottom:13px}
.pgrp-hdr{font-size:10.5px;font-weight:800;color:var(--mt);margin-bottom:6px;padding-left:2px;letter-spacing:.4px;text-transform:uppercase}
.prow{background:#fff;border:1.5px solid var(--bd);border-radius:10px;padding:9px 11px;margin-bottom:5px;display:flex;align-items:center;gap:8px;transition:all .1s}
.prow.has{border-color:var(--pr);background:var(--lt)}
.prow.has-g{border-color:var(--green);background:var(--glt)}
.pi{flex:1;min-width:0}
.pi-name{font-size:12px;font-weight:600;color:var(--tx);line-height:1.25}
.pi-code{font-size:10px;color:var(--mt);margin-top:1px}
.pcw{display:flex;align-items:center;gap:6px;flex-shrink:0}
.pbtn{width:29px;height:29px;border-radius:50%;border:1.5px solid var(--bd);background:#fff;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--pr);font-family:inherit;-webkit-tap-highlight-color:transparent}
.pbtn:active{background:var(--lt)}
.pqty{font-size:13.5px;font-weight:700;min-width:22px;text-align:center;color:var(--tx)}
.pgrid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.prcard{background:#fff;border:1.5px solid var(--bd);border-radius:11px;padding:15px 10px;cursor:pointer;text-align:center;transition:all .12s;-webkit-tap-highlight-color:transparent}
.prcard.on{border-color:var(--pr);background:var(--lt)}
.pr-badge{display:inline-block;font-size:9px;font-weight:700;padding:2px 8px;border-radius:20px;margin-bottom:5px}
.pr-badge.def{background:var(--pr);color:#fff}
.pr-badge.alt{background:#ddd;color:var(--mt)}
.pr-name{font-size:13.5px;font-weight:700;color:var(--tx)}
.pr-sub{font-size:11px;color:var(--mt);margin-top:3px}
.pay-list{display:flex;flex-direction:column;gap:6px}
.pay-card{background:#fff;border:1.5px solid var(--bd);border-radius:10px;padding:12px 13px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;transition:all .12s;-webkit-tap-highlight-color:transparent}
.pay-card.on{border-color:var(--pr);background:var(--lt)}
.pay-lbl{font-size:13.5px;font-weight:600;color:var(--tx)}
.pay-par{font-size:11px;color:var(--mt);margin-top:1px}
.pay-radio{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--bd);flex-shrink:0;display:flex;align-items:center;justify-content:center;background:#fff;transition:all .12s}
.pay-card.on .pay-radio{border-color:var(--pr);background:var(--pr)}
.pay-dot{width:6px;height:6px;border-radius:50%;background:#fff;display:none}
.pay-card.on .pay-dot{display:block}
.top-nav{display:flex;gap:8px;margin-bottom:13px;padding-bottom:13px;border-bottom:1.5px solid var(--bd)}
.res-kit{background:var(--deep);border-radius:11px;padding:13px 15px;margin-bottom:9px}
.res-kit-tipo{font-size:9.5px;color:rgba(255,255,255,.5);margin-bottom:2px;letter-spacing:.5px;text-transform:uppercase}
.res-kit-name{font-size:13.5px;font-weight:700;color:#fff;line-height:1.3}
.res-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}
.res-tag{background:rgba(255,255,255,.12);color:rgba(255,255,255,.85);font-size:10.5px;padding:2px 8px;border-radius:20px}
.res-sec{background:#fff;border:1.5px solid var(--bd);border-radius:11px;overflow:hidden;margin-bottom:8px}
.res-shdr{padding:7px 13px;background:var(--sf);border-bottom:1px solid var(--bd);font-size:10px;font-weight:800;color:var(--mt);letter-spacing:.4px;text-transform:uppercase}
.res-row{display:flex;justify-content:space-between;align-items:flex-start;padding:8px 13px;border-bottom:1px solid #E4EEEF;font-size:12.5px}
.res-row:last-child{border-bottom:none}
.res-rl{color:var(--mt);padding-right:8px;flex-shrink:0}
.res-rv{font-weight:600;color:var(--tx);text-align:right}
.res-rv.pos{color:var(--green)}
.res-rv.neg{color:var(--rd)}
.res-rv.or{color:#C07010}
.res-total-box{background:var(--pr);border-radius:11px;padding:13px 15px;display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.res-tl{color:rgba(255,255,255,.8);font-size:13px}
.res-tv{color:#fff;font-size:20px;font-weight:800}
.res-av-box{background:var(--glt);border:1.5px solid rgba(43,153,96,.3);border-radius:10px;padding:11px 13px;display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.av-l{color:var(--green);font-weight:600;font-size:13px}
.av-v{color:var(--green);font-weight:800;font-size:15px}
.res-clause{font-size:10.5px;color:var(--mt);text-align:center;line-height:1.6;padding:2px 4px 8px}
.obs-w{margin-top:8px}
.obs-l{font-size:10.5px;font-weight:700;color:var(--mt);display:block;margin-bottom:5px}
.obs-ta{width:100%;border:1.5px solid var(--bd);border-radius:10px;padding:10px 11px;font-size:13.5px;font-family:inherit;color:var(--tx);resize:vertical;min-height:70px;outline:none}
.obs-ta:focus{border-color:var(--pr)}
.client-box{background:#fff;border:1.5px solid var(--bd);border-radius:14px;padding:16px}
.doc-label{display:block;font-size:11.5px;font-weight:700;color:var(--mt);margin-bottom:7px}
.doc-row{display:flex;gap:8px}
.doc-input{flex:1;min-width:0;border:1.5px solid var(--bd);border-radius:10px;padding:12px;font-size:16px;font-family:inherit;color:var(--tx);outline:none}
.doc-input:focus{border-color:var(--pr)}
.lookup-btn{border:0;border-radius:10px;padding:0 15px;background:var(--pr);color:#fff;font:700 13px inherit;cursor:pointer}
.lookup-btn:disabled{background:var(--bd);cursor:default}
.lookup-status{font-size:11.5px;color:var(--mt);line-height:1.45;margin-top:8px;min-height:17px}
.lookup-status.err{color:var(--rd)}.lookup-status.ok{color:var(--green)}
.client-found{margin-top:12px;padding:12px;background:var(--glt);border:1.5px solid rgba(43,153,96,.3);border-radius:10px}
.client-found small{display:block;color:var(--green);font-size:10px;font-weight:800;text-transform:uppercase;margin-bottom:4px}
.client-found strong{font-size:13.5px;line-height:1.35;display:block}
.manual-name{margin-top:12px}.manual-name input{width:100%;border:1.5px solid var(--bd);border-radius:10px;padding:11px;font:500 14px inherit;outline:none}.manual-name input:focus{border-color:var(--pr)}
.share-modal{position:fixed;inset:0;background:rgba(0,30,31,.72);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px}
.share-modal[hidden]{display:none}
.share-card{width:100%;max-width:390px;background:#fff;border-radius:16px;padding:22px;text-align:center;box-shadow:0 18px 55px rgba(0,0,0,.28)}
.share-icon{font-size:38px;margin-bottom:8px}.share-title{font-size:19px;font-weight:800;color:var(--deep)}.share-text{font-size:13px;color:var(--mt);line-height:1.5;margin:7px 0 16px}
.share-main{width:100%;border:0;border-radius:10px;padding:13px;background:var(--green);color:#fff;font:700 14px inherit;cursor:pointer}.share-alt{width:100%;border:0;background:none;color:var(--mt);font:600 12px inherit;text-decoration:underline;padding:12px;cursor:pointer}

/* === PRINT === */
@media screen{.po{display:none!important}}
@media print{
  .no-print{display:none!important}
  .po{display:block!important}
  body{max-width:100%;background:#fff}
  .pp{padding:22px 28px;font-family:'Inter',sans-serif}
  .p-hdr{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:4px solid #199198;padding-bottom:14px;margin-bottom:16px}
  .p-logo{display:none}
  .p-brand-logo{max-height:54px;max-width:260px;width:auto;object-fit:contain}
  .p-orc{text-align:right}
  .p-orc-lbl{font-size:9px;font-weight:800;color:#999;letter-spacing:.5px;text-transform:uppercase}
  .p-orc-num{font-size:17px;font-weight:800;color:#004446}
  .p-orc-meta{font-size:10px;color:#666;margin-top:2px;line-height:1.6}
  .p-kit-bar{background:#004446;padding:9px 13px;border-radius:6px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between}
  .p-kit-name{font-size:12px;font-weight:700;color:#fff}
  .p-kit-tags{display:flex;gap:5px;flex-wrap:wrap}
  .p-kit-tag{background:rgba(255,255,255,.15);color:rgba(255,255,255,.9);font-size:9.5px;padding:2px 7px;border-radius:20px}
  .p-sec{font-size:8.5px;font-weight:800;color:#5F7A8E;letter-spacing:.8px;text-transform:uppercase;margin:13px 0 4px}
  table{width:100%;border-collapse:collapse;font-size:11px}
  th{background:#199198;color:#fff;padding:6px 9px;text-align:left;font-size:9.5px;font-weight:700}
  th.r,td.r{text-align:right}
  th.c,td.c{text-align:center}
  td{padding:5px 9px;border-bottom:1px solid #E4EEEF;vertical-align:top}
  tr.alt td{background:#F4F8F8}
  td.nm{font-weight:600}
  td.b-col{color:#2B9960;font-weight:600}
  .p-tots{overflow:hidden;margin:12px 0}
  .p-ti{float:right;width:265px}
  .ptr{display:flex;justify-content:space-between;padding:4px 0;font-size:11px;border-bottom:1px solid #E4EEEF}
  .ptr.big{font-size:16px;font-weight:800;color:#199198;border-top:2px solid #199198;border-bottom:none;padding-top:7px;margin-top:5px}
  .ptr.mt{color:#888;font-size:10px}
  .ptr.neg{color:#C83232;font-weight:600}
  .ptr.pos{color:#2B9960;font-weight:600}
  .ptr.av{color:#2B9960;font-size:13px;font-weight:700;border-bottom:none}
  .p-clr{clear:both}
  .p-conds{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
  .p-cond{background:#F4F8F8;border-radius:5px;padding:8px 10px}
  .p-cond-l{font-size:8px;font-weight:800;color:#5F7A8E;text-transform:uppercase;margin-bottom:2px;letter-spacing:.3px}
  .p-cond-v{font-size:10.5px}
  .p-obs{border:1px solid #B8D4D6;border-radius:5px;padding:8px 11px;margin:10px 0}
  .p-obs-l{font-size:8px;font-weight:800;color:#5F7A8E;text-transform:uppercase;margin-bottom:3px}
  .p-obs-t{font-size:10px;color:#444;white-space:pre-wrap;line-height:1.5}
  .p-acc{margin-top:16px;font-size:9px;color:#777;text-align:center;font-style:italic;border-top:1px dashed #ccc;padding-top:10px}
  .p-sig{margin-top:60px;display:grid;grid-template-columns:1fr 1fr;gap:50px}
  .p-sig-l{border-top:1px solid #888;padding-top:5px;font-size:9px;color:#666;text-align:center}
  .p-ftr{margin-top:10px;display:flex;justify-content:space-between;font-size:8.5px;color:#999}
}
</style>
</head>
<body>
<div class="no-print">

// ════ CÁLCULO DE PRODUTOS DO KIT ════
function calcKitProds(kitId,N,mod,varEcg,varInd,varMax,pm){
  const kit=KITS[kitId];if(!kit||N<=0)return[];
  const P=PRECOS[pm];const isBC=mod==='bestchoice';const isMax=mod==='maxrelin';
  const res={};
  for(const p of kit.prods){
    let code=p.c,H=p.H,vol=p.vol;
    if(code==='ECG'){code=varEcg==='ecegon'?'CM10A004':'CM10A005';}
    else if(code==='IND'){code=varInd==='20ml'?'CM10A007':'CM10A006';vol=varInd==='20ml'?20:50;}
    else if(code==='MAX'){code=varMax==='20ml'?'CM10A013':'CM10A014';vol=varMax==='20ml'?20:50;}
    if(p.c==='IND'&&isBC)H=H*2;
    let inc=false;
    if(p.bc==='always'||p.bc==='dbl')inc=true;
    else if(p.bc==='max')inc=isBC||isMax;
    else if(p.bc==='alwmax')inc=true;
    if(inc&&vol>0){const q=Math.ceil(N*H/vol);if(q>0)res[code]=(res[code]||0)+q;}
  }
  // Ordem de exibição: eCG e Diluente ficam sempre consecutivos
  const SORT_ORDER=['CM10A008','CM10A005','CM10A004','CM10A003','CM10A002','CM10A007','CM10A006','CM10A011','CM10A012','CM10A010','CM10A009','CM10A013','CM10A014','CM10A001','CM10A023'];
  return Object.entries(res)
    .sort(([a],[b])=>{const ia=SORT_ORDER.indexOf(a),ib=SORT_ORDER.indexOf(b);return(ia<0?9999:ia)-(ib<0?9999:ib);})
    .map(([code,qty])=>({code,qty,preco:P[code]||0,valor:qty*(P[code]||0),nome:PROD_NOME[code]||code}));
}
// ════ CÁLCULO DE BONIFICAÇÃO ════
function getBonifRate(tipo,mod){
  if(tipo==='leite')return BONIF_RATES.leite;
  if(mod==='bestchoice')return BONIF_RATES.corte_bestchoice;
  if(mod==='maxrelin')return BONIF_RATES.corte_maxrelin;
  return BONIF_RATES.corte_nenhum;
}
function calcBonif(allProds,N,tipo,mod){
  const rate=getBonifRate(tipo,mod);
  const budget=N*rate;
  if(budget<=0)return{dist:{},total:0,budget:0};
  const elig=allProds.filter(p=>!BONIF_EXCLUIDOS.includes(p.code)&&p.qty>0&&p.preco>0);
  if(!elig.length)return{dist:{},total:0,budget};
  const minP=Math.min(...elig.map(p=>p.preco));
  if(minP>budget+0.01)return{dist:{},total:0,budget};
  // Base: total dos itens ELEGÍVEIS → % alvo igual para todos
  const totalElig=elig.reduce((s,p)=>s+p.qty*p.preco,0);
  if(totalElig<=0)return{dist:{},total:0,budget};
  const targetPct=budget/totalElig;
  const dist={};let used=0;
  // 1ª passagem: floor com % alvo uniforme (mesma taxa para todos os itens)
  elig.forEach(p=>{
    const q=Math.min(Math.floor(p.qty*targetPct),p.qty);
    dist[p.code]=q;used+=q*p.preco;
  });
  // 2ª passagem: distribui saldo 1 unidade por vez priorizando sempre
  // o item com maior déficit de % em relação à taxa alvo,
  // garantindo que os percentuais finais fiquem o mais próximos possível
  while(true){
    let best=null,bestDef=-Infinity;
    for(const p of elig){
      if((dist[p.code]||0)>=p.qty)continue;
      if(used+p.preco>budget+0.01)continue;
      const curPct=(dist[p.code]||0)/p.qty;
      const def=targetPct-curPct;
      if(def>bestDef){bestDef=def;best=p;}
    }
    if(!best)break;
    dist[best.code]=(dist[best.code]||0)+1;
    used+=best.preco;
  }
  const total=Object.entries(dist).reduce((s,[code,qty])=>{const p=allProds.find(x=>x.code===code);return s+qty*(p?p.preco:0);},0);
  return{dist,total,budget};
}
// ════ CÁLCULO GERAL ════
function calcOrder(){
  const kit=getKit();if(!kit)return null;
  const N=S.prot;const pm=S.preco;
  // Regra de preço: kit sempre campanha; avulso usa tabela selecionada,
  // exceto se o produto também está no kit (nesse caso campanha também).
  const Pcamp=PRECOS['campanha'];
  const Psel=PRECOS[pm];
  const kitProds=calcKitProds(S.kit,N,S.mod,S.varEcg,S.varInd,S.varMax,'campanha');
  const kitCodes=new Set(kitProds.map(p=>p.code));
  const vacProds=[];
  if(S.vac==='sim'&&S.vacF&&S.vacD>0){
    const vc=S.vacF==='250ml'?'CM10A015':'CM10A016';
    const vq=S.vacF==='250ml'?Math.ceil(S.vacD/50):Math.ceil(S.vacD/20);
    const precoVac=Psel[vc]||0;
    if(vq>0)vacProds.push({code:vc,qty:vq,preco:precoVac,valor:vq*precoVac,nome:PROD_NOME[vc]||vc});
  }
  const avProds=Object.entries(S.av).filter(([,q])=>q>0).map(([code,qty])=>{
    const preco=kitCodes.has(code)?Pcamp[code]||0:Psel[code]||0;
    return{code,qty,preco,valor:qty*preco,nome:PROD_NOME[code]||code};
  });
  const allMap={};
  [...kitProds,...vacProds,...avProds].forEach(p=>{
    if(allMap[p.code]){allMap[p.code].qty+=p.qty;allMap[p.code].valor+=p.valor;}
    else allMap[p.code]={...p};
  });
  const allProds=Object.values(allMap);
  // Bonificação distribui apenas sobre produtos do kit (avulsos e vacinas excluídos)
  const bonif=calcBonif([...kitProds],N,kit.tipo,S.mod);
  const bAplicTotal=Object.entries(S.bonifAplic).reduce((s,[code,qty])=>s+qty*(Pcamp[code]||0),0);
  const totalPedido=allProds.reduce((s,p)=>s+p.valor,0);
  const valorVacina=vacProds.reduce((s,p)=>s+p.valor,0);
  const valorProtocolo=kitProds.reduce((s,p)=>s+p.valor,0);
  const totalBonif=bonif.total+bAplicTotal;
  const descAmt=totalPedido*(S.desconto||0)/100;
  const totalFinal=Math.max(0,totalPedido-totalBonif-descAmt);
  const aVista=totalFinal*0.97;
  return{allProds,kitProds,vacProds,avProds,bonif,bAplicTotal,totalBonif,totalPedido,valorProtocolo,valorVacina,descAmt,totalFinal,aVista};
}
// ════ NAVEGAÇÃO ════
function getSteps(){
  const s=['cliente','tipo','kit'];
  if(S.tipo==='corte')s.push('mod');
  const k=getKit();
  if(k){
    const needVar=k.hasEcg||k.hasInd||k.hasMaxrelin||(S.mod&&S.mod!=='nenhum');
    if(needVar)s.push('variantes');
  }
  s.push('prot','bonifAplic','pag','resumo');
  return s;
}
function canNext(){
  const k=getKit();
  if(sid==='cliente')return true;
  if(sid==='tipo')return!!S.tipo;
  if(sid==='kit')return!!S.kit;
  if(sid==='mod')return!!S.mod;
  if(sid==='variantes'){
    if(k&&k.hasEcg&&!S.varEcg)return false;
    if(k&&k.hasInd&&!S.varInd)return false;
    if(k&&k.hasMaxrelin&&!S.varMax)return false;
    if(S.mod&&S.mod!=='nenhum'&&!S.varMax)return false;
    return true;
  }
  if(sid==='prot')return S.prot>0;
  if(sid==='vac')return true;
  if(sid==='pag')return!!S.pag;
  return true;
}
function frascos(){if(!S.vacF||!S.vacD)return'—';const d=S.vacD||0;return S.vacF==='250ml'?Math.ceil(d/50)+' frascos':Math.ceil(d/20)+' frascos'}
function avCount(){return Object.values(S.av).filter(v=>v>0).length}
function bonifAplicCount(){return Object.values(S.bonifAplic).filter(v=>v>0).length}
function bonifAplicTotal(pm){const P=PRECOS[pm||S.preco];return Object.entries(S.bonifAplic).reduce((s,[c,q])=>s+q*(P[c]||0),0)}
function goNext(){if(!canNext())return;const ss=getSteps();const i=ss.indexOf(sid);if(i<ss.length-1){const next=ss[i+1];if(next==='variantes'){if(!S.varInd)S.varInd='50ml';if(!S.varMax)S.varMax='50ml';}sid=next;render();}}
function goBack(){const ss=getSteps();const i=ss.indexOf(sid);if(i>0){sid=ss[i-1];render();}}
function updNav(){const b=document.querySelector('.btn-nxt');if(b)b.classList.toggle('off',!canNext());}
function updDoses(){const el=document.getElementById('doses-res');if(!el)return;if(S.vacF&&S.vacD>0){el.style.display='flex';const v=document.getElementById('doses-val');if(v)v.textContent=frascos();}else el.style.display='none';}

function addProt(n){S.prot=(S.prot||0)+n;const e=document.getElementById('pi');if(e)e.value=S.prot||'';updateBonifEstimativa();updNav();}
function addDoses(n){S.vacD=(S.vacD||0)+n;const e=document.getElementById('doses-inp');if(e)e.value=S.vacD;updNav();updDoses();}
function chgP(d){S.prot=Math.max(0,S.prot+d);const e=document.getElementById('pi');if(e)e.value=S.prot||'';updateBonifEstimativa();updNav();}

function chgBonifAplic(c,d){S.bonifAplic[c]=Math.max(0,(S.bonifAplic[c]||0)+d);const pr=document.getElementById('ba-'+c);if(pr)pr.classList.toggle('has-g',S.bonifAplic[c]>0);const pq=document.getElementById('baq-'+c);if(pq)pq.textContent=S.bonifAplic[c]||'—';const totEl=document.getElementById('bonif-aplic-total');if(totEl){const tot=bonifAplicTotal();totEl.innerHTML=tot>0?`<span class="tip-ok">Bonificação de aplicadores: <strong>${fmt(tot)}</strong> — somada ao total de bonificação.</span>`:'<span class="tip">Os aplicadores bonificados são somados à bonificação dos kits.</span>';}}

function cards(items,sel,fn){
  return`<div class="card-list">${items.map(it=>`
  <div class="scard${sel===it.id?' on':''}" onclick="${fn}('${it.id}')">
    <div class="sc-icon">${it.ic||'📋'}</div>
    <div class="sc-body"><div class="sc-name">${it.nm}</div><div class="sc-desc">${it.ds||''}</div></div>
    <div class="sc-radio"><span class="sc-chk">✓</span></div>
  </div>`).join('')}</div>`;
}

  <div class="pgrid">${items.map(p=>{

function goToStep(id){sid=id;render();}
function renderNav(){

    +`<button class="btn-pdf" onclick="gerarPDF()" style="flex:1">📄 PDF</button>`;

  if(sid==='pag')return`<button class="btn-bk" onclick="goBack()">← Voltar</button>`
    +`<button class="btn-nxt" style="flex:1;background:var(--mt);font-size:12px" onclick="goToStep('vac')">Adicionais</button>`
    +`<button class="btn-nxt${ok?'':' off'}" style="flex:1.5" onclick="canNext()&&goToStep('resumo')" >Finalizar</button>`;

    +`<button class="btn-nxt${ok?'':' off'}" style="flex:2" onclick="canNext()&&goToStep('avulsos')" >Próximo →</button>`;
  if(sid==='avulsos')return`<button class="btn-bk" onclick="goToStep('vac')">← Voltar</button>`
    +`<button class="btn-nxt" style="flex:2" onclick="goToStep('preco')">Próximo →</button>`;
  if(sid==='preco')return`<button class="btn-bk" onclick="goToStep('avulsos')">← Voltar</button>`
    +`<button class="btn-nxt" style="flex:2" onclick="goToStep('resumo')">Finalizar</button>`;
  // bonifAplic: Próximo vai direto para pag
  if(sid==='bonifAplic')return`<button class="btn-bk" onclick="goBack()">← Voltar</button>`
    +`<button class="btn-nxt" style="flex:2" onclick="goToStep('pag')">Próximo →</button>`;

function render(){
  const ss=getSteps();
  const sideSteps=['vac','avulsos','preco'];
  let idx=ss.indexOf(sid);
  if(idx===-1&&sideSteps.includes(sid))idx=ss.indexOf('pag');
  const total=ss.length;
  // Exibir total máximo esperado para evitar que o contador mude durante o fluxo
  // corte (ou ainda sem tipo): max=9 | leite: max=8
  const displayTotal=S.tipo==='leite'?Math.max(total,8):Math.max(total,9);
  document.getElementById('stepfrac').textContent=`${idx+1} / ${displayTotal}`;
  document.getElementById('progfill').style.width=Math.round(((idx+1)/displayTotal)*100)+'%';
  const m=META[sid]||{t:'',s:''};
  document.getElementById('stitle').textContent=m.t;
  document.getElementById('ssub').textContent=m.s;
  document.getElementById('content').innerHTML=renderStep();
  const bbar=document.getElementById('bbar');
  bbar.innerHTML=renderNav();
  bbar.style.display=TOP_NAV_STEPS.includes(sid)?'none':'flex';
  buildPrint();
  window.scrollTo(0,0);
}

function setTipo(v){S.tipo=v;S.kit=null;S.mod=null;S.varEcg=null;S.varInd=null;S.varMax=null;S.bonifAplic={};render();if(sid==='tipo')setTimeout(goNext,260);}

function sv(f,v){S[f]=v;render();}
function digits(v){return String(v||'').replace(/\D/g,'')}
function esc(v){return String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function formatDoc(v){const d=digits(v);if(d.length===11)return d.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/,'$1.$2.$3-$4');if(d.length===14)return d.replace(/(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})/,'$1.$2.$3/$4-$5');return d}
function validaDV(d,tamanho){if(d.length!==tamanho||/^(\d)\1+$/.test(d))return false;const base=tamanho===11?9:12;const calc=n=>{let soma=0,peso=n===9?10:(n===10?11:(n===12?5:6));for(let i=0;i<n;i++){soma+=(+d[i])*peso--;if(peso===1)peso=9}const r=(soma*10)%11;return r===10?0:r};return +d[base]===calc(base)&&+d[base+1]===calc(base+1)}
function validarDocumento(v){const d=digits(v);return d.length===11?validaDV(d,11):d.length===14?validaDV(d,14):false}
function manualNameHtml(){return`<div class="manual-name"><label class="doc-label" for="cliente-nome">Nome completo</label><input id="cliente-nome" maxlength="150" placeholder="Digite o nome do cliente" value="${esc(S.clienteNome)}" oninput="S.clienteNome=this.value.trimStart();S.clienteFonte='informado';updNav()"></div>`}
function clienteResultHtml(){return`<div class="client-found"><small>${S.clienteFonte==='cnpj-publico'?'CNPJ localizado':'Cliente identificado'}</small><strong>${esc(S.clienteNome)}</strong></div>`}
function clienteDocInput(el){const d=digits(el.value).slice(0,14);el.value=formatDoc(d);S.clienteDoc=d;S.clienteTipo=d.length<=11?'CPF':'CNPJ';S.clienteNome='';S.clienteFonte='';const res=document.getElementById('cliente-result');if(res)res.innerHTML=d.length===11?manualNameHtml():'';const st=document.getElementById('lookup-status');if(st){st.className='lookup-status';st.textContent=d.length===11?'CPF válido: informe o nome completo.':'Informe os 14 dígitos do CNPJ e toque em Buscar.'}updNav()}
async function consultarCliente(){const d=digits(S.clienteDoc),st=document.getElementById('lookup-status'),btn=document.getElementById('lookup-btn'),res=document.getElementById('cliente-result');if(!validarDocumento(d)){st.className='lookup-status err';st.textContent='CPF ou CNPJ inválido. Confira os números digitados.';S.clienteNome='';updNav();return}if(d.length===11){S.clienteTipo='CPF';st.className='lookup-status';st.textContent='Por privacidade, a consulta pública de CPF não fornece o nome. Digite-o abaixo.';res.innerHTML=manualNameHtml();document.getElementById('cliente-nome')?.focus();updNav();return}S.clienteTipo='CNPJ';btn.disabled=true;btn.textContent='Buscando…';st.className='lookup-status';st.textContent='Consultando os dados cadastrais…';try{const r=await fetch('https://brasilapi.com.br/api/cnpj/v1/'+d,{headers:{Accept:'application/json'}});if(!r.ok)throw new Error('CNPJ não localizado');const j=await r.json();const nome=(j.razao_social||j.nome_fantasia||'').trim();if(!nome)throw new Error('Razão Social não disponível');S.clienteNome=nome;S.clienteFonte='cnpj-publico';st.className='lookup-status ok';st.textContent='CNPJ localizado com sucesso.';res.innerHTML=clienteResultHtml()}catch(e){S.clienteNome='';st.className='lookup-status err';st.textContent='Não foi possível consultar agora. Confira o CNPJ ou tente novamente.';res.innerHTML=`<div class="manual-name"><label class="doc-label">Razão Social</label><input maxlength="150" placeholder="Digite a Razão Social" oninput="S.clienteNome=this.value.trimStart();S.clienteFonte='informado';updNav()"></div>`}finally{btn.disabled=false;btn.textContent='Buscar';updNav()}}

function ativarEstiloPDF(){
  const style=document.createElement('style');style.id='pdf-print-style';let css='';
  for(const sheet of document.styleSheets){try{for(const rule of sheet.cssRules||[]){if(rule.constructor.name==='CSSMediaRule'&&String(rule.conditionText).includes('print')){for(const inner of rule.cssRules)css+=inner.cssText+'\n'}}}catch(e){}}
  style.textContent=css+'\n.po{display:block!important;position:fixed!important;left:-10000px!important;top:0!important;width:794px!important;background:#fff!important;z-index:-1!important}.pp{width:794px!important}';
  document.head.appendChild(style);return style;
}

function fecharCompartilhamento(){document.getElementById('share-modal').hidden=true}
async function compartilharPDFGerado(){
  if(!_pdfShareFile)return;
  try{await navigator.share({title:'Orçamento GLOBALGEN',text:textoWhatsApp(),files:[_pdfShareFile]});fecharCompartilhamento()}
  catch(e){if(e&&e.name!=='AbortError'){alert('O compartilhamento de arquivos não está disponível neste navegador. O PDF será baixado.');baixarPDFGerado()}}
}

function criarPDFBlob(escala,qualidade,nome){return html2pdf().set({margin:0,filename:nome,image:{type:'jpeg',quality:qualidade},html2canvas:{scale:escala,useCORS:true,backgroundColor:'#ffffff',logging:false},jsPDF:{unit:'pt',format:'a4',orientation:'portrait'},pagebreak:{mode:['css','legacy'],avoid:['tr','table','.p-cond','.p-obs']}}).from(document.getElementById('printpage')).outputPdf('blob')}
async function gerarPDF(){
  buildPrint();
  const nome=nomeArquivoPDF(),btn=document.querySelector('.btn-pdf');if(btn){btn.disabled=true;btn.textContent='Gerando PDF…'}
  if(typeof html2pdf==='function'){
    const style=ativarEstiloPDF(),mobile=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent);let blob=null;
    try{
      try{blob=await criarPDFBlob(mobile?1.15:2,mobile ? 0.90 : 0.98,nome)}catch(primeiroErro){if(!mobile)throw primeiroErro;blob=await criarPDFBlob(0.85,0.86,nome)}
    }catch(e){alert('Não foi possível gerar o PDF automaticamente. Será aberta a opção de impressão.');gerarPDFPorImpressao(nome)}
    finally{style.remove();if(btn){btn.disabled=false;btn.textContent='📄 Gerar PDF'}}
    if(blob){
      let arquivo=null;try{arquivo=new File([blob],nome,{type:'application/pdf'})}catch(e){}
      let podeCompartilhar=false;try{podeCompartilhar=!!(arquivo&&navigator.share&&navigator.canShare&&navigator.canShare({files:[arquivo]}))}catch(e){}
      if(podeCompartilhar){
        if(mobile)mostrarCompartilhamento(arquivo,blob,nome);
        else try{await navigator.share({title:'Orçamento GLOBALGEN',text:textoWhatsApp(),files:[arquivo]})}catch(e){if(e&&e.name!=='AbortError')mostrarCompartilhamento(arquivo,blob,nome)}
      }else{baixarBlob(blob,nome);setTimeout(sugerirWhatsApp,300)}
    }
  }else{gerarPDFPorImpressao(nome);if(btn){btn.disabled=false;btn.textContent='📄 Gerar PDF'}}
}
function gerarPDFPorImpressao(nome){
  const titulo=document.title;document.title=nome.replace(/\.pdf$/i,'');let sugerido=false;
  const apos=()=>{if(sugerido)return;sugerido=true;document.title=titulo;window.removeEventListener('afterprint',apos);setTimeout(sugerirWhatsApp,250)};
  window.addEventListener('afterprint',apos);setTimeout(()=>window.print(),1000);
}

function parseSoapResponse(xmlText){
  try{
    const doc=new DOMParser().parseFromString(xmlText,'text/xml');
    const erros=Array.from(doc.querySelectorAll('erros descErr')).map(e=>e.textContent.trim()).filter(Boolean);
    if(erros.length)return{ok:false,error:erros.join(' | ')};
    const numPed=doc.querySelector('numPed');
    return{ok:true,numPed:numPed?numPed.textContent.trim():'—'};
  }catch(e){return{ok:false,error:'Erro ao processar resposta: '+e.message};}
}

  try{
    // Qtde líquida: total menos o que vai para bonificação
    const prodsVenda=T.allProds
      .map(p=>({code:p.code,qty:p.qty-(T.bonif.dist[p.code]||0),preco:p.preco*(1-descPct)}))
      .filter(p=>p.qty>0);
    const numV=Date.now();
    const respVenda=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/xml;charset=ISO-8859-1'},body:buildSoapEnvelope(numV,API_TNS_VENDA,'NOR',pg.codCpg,prodsVenda,codCli,codRep)});
    if(!respVenda.ok)throw new Error(`HTTP ${respVenda.status}`);
    const resV=parseSoapResponse(await respVenda.text());
    if(!resV.ok){resultEl.innerHTML=`<div style="background:#FFF0F0;border:1.5px solid #E08080;border-radius:8px;padding:10px 13px;font-size:12.5px;color:#C83232;margin-top:8px">❌ Erro no pedido de venda:<br><strong>${escXml(resV.error)}</strong></div>`;return;}

    // ── 2. PEDIDO DE BONIFICAÇÃO ──
    resultEl.innerHTML=`<div class="tip-ok" style="margin-top:8px">✅ Venda criada: <strong>Nº ${resV.numPed}</strong></div><div class="tip" style="margin-top:6px">⏳ Enviando pedido de <strong>bonificação</strong>…</div>`;
    const prodsBonus=[];
    Object.entries(T.bonif.dist).forEach(([code,qty])=>{if(qty>0){const p=T.allProds.find(x=>x.code===code);if(p)prodsBonus.push({code,qty,preco:p.preco});}});
    const P=PRECOS[S.preco];
    Object.entries(S.bonifAplic).forEach(([code,qty])=>{if(qty>0)prodsBonus.push({code,qty,preco:P[code]||0});});

    if(prodsBonus.length===0){
      resultEl.innerHTML=`<div class="tip-ok" style="margin-top:8px">✅ Venda criada: <strong>Nº ${resV.numPed}</strong><br><span style="font-size:11px;opacity:.8">Sem itens de bonificação neste orçamento.</span></div>`;
      return;
    }
    const numB=Date.now()+1;
    const respBon=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/xml;charset=ISO-8859-1'},body:buildSoapEnvelope(numB,API_TNS_BON,'BON',API_CPG_BON,prodsBonus,codCli,codRep)});
    if(!respBon.ok)throw new Error(`HTTP ${respBon.status}`);
    const resB=parseSoapResponse(await respBon.text());
    if(!resB.ok){
      resultEl.innerHTML=`<div class="tip-ok" style="margin-top:8px">✅ Venda: <strong>Nº ${resV.numPed}</strong></div><div style="background:#FFF0F0;border:1.5px solid #E08080;border-radius:8px;padding:10px 13px;font-size:12.5px;color:#C83232;margin-top:6px">⚠️ Venda criada, mas erro na bonificação:<br><strong>${escXml(resB.error)}</strong></div>`;
      return;
    }
    resultEl.innerHTML=`<div class="tip-ok" style="margin-top:8px">✅ Venda: <strong>Nº ${resV.numPed}</strong></div><div class="tip-ok" style="margin-top:6px">✅ Bonificação: <strong>Nº ${resB.numPed}</strong></div>`;
  }catch(e){
    resultEl.innerHTML=`<div style="background:#FFF0F0;border:1.5px solid #E08080;border-radius:8px;padding:10px 13px;font-size:12.5px;color:#C83232;margin-top:8px">❌ Erro de conexão:<br><strong>${escXml(e.message)}</strong><br><span style="font-size:11px;margin-top:4px;display:block;opacity:.8">Abra o app com Chrome --disable-web-security para testes na rede interna.</span></div>`;
  }
}
// ════ FIM INTEGRAÇÃO SENIOR G5 ════
// ════ INIT ════
document.getElementById('app-logo').src=GLOBALGEN_LOGO;
render();
</script>
